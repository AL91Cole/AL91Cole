name: Repository privacy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test privacy checks
        run: node --test scripts/repository-privacy.test.mjs
      - name: Check tracked files
        run: node scripts/repository-privacy.mjs
